name: Update MAL

on:
  schedule:
    - cron: "0 20 * * *"   # tiap hari pukul 03.00 WIB
  workflow_dispatch:        # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Ambil data dari MyAnimeList
        run: node scripts/update-mal.mjs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_USERNAME: Heatzen
      - name: Simpan jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mal.json
          git diff --staged --quiet || (git commit -m "Update data MAL" && git push)
